# =======================================================================
#  الملف: .github/workflows/keep-alive.yml
#  المشروع: منصة شكاوى لجنة الحج
#  الوصف: «روبوت تنشيط Supabase» — يزور قاعدة البيانات مرة كل يوم حتى لا يوقفها Supabase
#         (المشروع المجاني يتوقف بعد نحو أسبوع بلا نشاط)، وإن وجدها متوقفة يعيد تشغيلها تلقائياً.
#  الزر: GitHub ← تبويب Actions ← Keep Supabase awake ← Run workflow (تشغيل يدوي في أي وقت).
#  ملاحظات:
#    - الزيارة اليومية تستخدم المفتاح العام (anon) الموجود في config.js؛ لا تحتاج أي سر.
#    - إعادة التشغيل التلقائية تحتاج سراً في GitHub اسمه SUPABASE_ACCESS_TOKEN
#      (مفتاح إدارة من supabase.com/dashboard/account/tokens)؛ بدونه يكتفي الروبوت بالتنبيه.
#    - GitHub يوقف المهام المجدولة إن لم يتغيّر المستودع 60 يوماً؛ يعاد تفعيلها من تبويب Actions.
#  سجل التعديلات:
#    2026-09-27  الإصدار الأول: زيارة يومية.
#    2026-09-29  فحص حالة المشروع وإعادة تشغيله تلقائياً إن كان متوقفاً (بمفتاح الإدارة).
# =======================================================================

# اسم المهمة كما يظهر في تبويب Actions
name: Keep Supabase awake

# متى تعمل: كل يوم الساعة 06:00 بتوقيت UTC (09:00 بتوقيت مكة)، ويدوياً بزر Run workflow
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# صلاحيات دنيا: قراءة المستودع فقط
permissions:
  contents: read

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      # جلب ملفات المستودع لقراءة رابط المشروع والمفتاح العام من config.js
      - name: Checkout
        uses: actions/checkout@v4

      # الزيارة اليومية؛ وإن لم تُجب قاعدة البيانات: فحص حالة المشروع وإعادة تشغيله
      - name: Ping or restore Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' config.js | head -1)
          KEY=$(grep -o 'eyJ[^"]*' config.js | head -1)
          REF=$(echo "$URL" | sed -E 's#https://([a-z0-9]+)\.supabase\.co#\1#')

          # 1) الزيارة: إن أجابت قاعدة البيانات فكل شيء يعمل
          if curl --fail --silent --show-error --max-time 60 -X POST "$URL/rest/v1/rpc/get_access_config" \
               -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'; then
            echo
            echo "✅ Supabase is awake."
            exit 0
          fi

          # 2) لم تُجب: بدون مفتاح الإدارة لا نستطيع إعادة التشغيل، فنفشل ليظهر التنبيه في GitHub
          echo "⚠️ Supabase did not answer."
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Add the SUPABASE_ACCESS_TOKEN secret to restore it automatically, or restore it from the Supabase dashboard."
            exit 1
          fi

          # 3) فحص حالة المشروع، وإعادة تشغيله إن كان متوقفاً (INACTIVE)
          STATUS=$(curl --silent --max-time 60 "https://api.supabase.com/v1/projects/$REF" \
                     -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | grep -o '"status":"[A-Z_]*"' | head -1)
          echo "Project status: $STATUS"
          if echo "$STATUS" | grep -q "INACTIVE"; then
            curl --fail --silent --show-error --max-time 60 -X POST "https://api.supabase.com/v1/projects/$REF/restore" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"
            echo
            echo "🔄 Restore requested. Supabase needs a few minutes to start."
          else
            echo "Project is not paused; it may be a temporary network problem. Try again in a few minutes."
            exit 1
          fi
