<!doctype html>
<!--
=======================================================================
  الملف: main.html
  المشروع: منصة شكاوى لجنة الحج
  الوصف: تطبيق React (يعمل من المتصفح مباشرة) متصل بـ Supabase.
  يعتمد على: config.js (الاتصال، التصنيفات، قواعد التنبيهات) + supabase/schema.sql

  الصفحات:
    1) المشتكي (الرابط الأساسي): خانة كلمة المرور أولاً (عامة أو خاصة حسب إعداد الأدمن)، وتحتها
       زر «تقديم شكوى مباشرة» إن فعّله الأدمن ← الاسم، الهاتف، واتس/تلغرام، المشتكى عليه، عنوان الاعتراض، نص الاعتراض
       ← «تم تسجيل الشكوى بنجاح» مع رقم الشكوى ورمز المتابعة.
    2) نتيجة الشكوى (‎#/result): الشكاوى المحفوظة على الجهاز تلقائياً، أو بالرقم + رمز المتابعة
       ← الحالة والنتيجة وتاريخ الإغلاق فقط.
    2ب) الاعتراض (‎#/objection): المشتكى عليه برقم الشكوى + رمز الاعتراض ← الملخص فقط ← اعتراض واحد.
    3) الأدمن (‎#/admin): «المطلوب» (تنبيهات ذكية) وجدول الشكاوى (اختيار عدة صفوف وتغييرها معاً،
       وتصدير Excel)، إعدادات دخول المشتكين، وكلمات مرور الإدارة.
    4) التقارير (‎#/reports): بكلمة مرور الإدارة — أعداد الشكاوى خلال فترة وجدول بحالاتها.

  ملاحظات:
    - الحالات: جديد / قيد المراجعة / جاري المتابعة / مغلقة (تُستخدم أسماء لاتينية للألوان: new/review/follow/closed).
    - الموقع لا يقرأ الجداول مباشرة؛ كل العمليات عبر دوال Supabase تتحقق من المدخلات داخلها.
    - كلمتا الأدمن والإدارة تُحفظان في sessionStorage؛ شكاوى المشتكي (الرقم + الرمز) في localStorage.
    - قاعدة معتمدة: تصميم ثابت على الجوال (لا تمرير أفقي للصفحة؛ الجداول داخل إطار قابل للتمرير).

  سجل التعديلات:
    2026-09-24  الإصدار الأول، ثم عدة إعادات تصميم (ثلاث صفحات، جدول كلمات مرور موحّد، ألوان الحالات،
                إلغاء واتساب، زر إظهار كلمة المرور، التنبيهات الذكية وتبويب «المطلوب» بفترات).
    2026-09-24  الحالات الجديدة: جديد / قيد المراجعة / جاري المتابعة / مغلقة.
                وضع دخول المشتكين قابل للتحكم (مفتوح / عامة / خاصة). رقم الشكوى ورمز المتابعة
                وصفحة «نتيجة الشكوى». جدول الشكاوى بدل البطاقات: اختيار عدة صفوف وتغييرها معاً،
                نافذة تفاصيل للتعديل الفردي، وتصدير Excel.
    2026-09-24  جدول الأدمن: أسهم فرز على العناوين، عدد الأسطر (10/50/100) مع صفحات، قائمة لإظهار
                وإخفاء الأعمدة، وتكبير/تصغير الخط؛ التفضيلات تُحفظ على الجهاز.
    2026-09-24  صفحة كلمة المرور تبقى أولاً (عامة أو خاصة) مع زر «تقديم شكوى مباشرة» يُظهره أو
                يخفيه الأدمن بمفتاح؛ إضافة رقم التواصل للنموذج والجدول والتفاصيل والتصدير.
    2026-09-24  مفتاح زر التقديم المباشر يُحفظ فوراً عند الضغط (كان يحتاج زر «حفظ» فلا يُطبَّق).
    2026-09-27  رابط واحد لكل المنصة: شريط سفلي بروابط الرئيسية ونتيجة الشكوى والإدارة والتقارير.
    2026-09-27  حذف الشريط السفلي بطلب الإدارة (الإدارة والتقارير تُفتحان بروابطهما ‎#/admin و ‎#/reports).
    2026-09-29  الجلسات: قسم في تفاصيل كل شكوى (سجل + إضافة جلسة تُرحِّل المحال إليه والنتيجة والحالة
                إلى الشكوى) وتبويب «الجلسات» (اليوم / القادمة / السابقة / الكل). رابط «تنشيط قاعدة البيانات»
                أسفل دخول الأدمن يفتح روبوت GitHub.
    2026-09-29  اعتراض المشتكى عليه: قسم في تفاصيل الشكوى لتوليد رمز اعتراض مع ملخص، وصفحة عامة ‎#/objection
                يقدّم فيها اعتراضه مرة واحدة؛ تنبيه «وصل اعتراض» في «المطلوب»، وعمود «الاعتراض» في الجدول.
    2026-09-29  سجل الشكوى وسجل الإحالة (خط زمني في تفاصيل الشكوى)، ومهلة الاعتراض مع تمديد استثنائي
                بسبب إلزامي؛ صفحة الاعتراض تعرض آخر موعد وترفض بعده.
    2026-09-29  بطاقة الشكوى في التقارير للاطلاع فقط (تفاصيل + اعتراض + جلسات + سجل)، مع مفتاح في تبويب
                «كلمات مرور الإدارة» لإظهارها أو إخفائها.
    2026-09-29  التصدير إلى Excel ‎.xlsx (بدل CSV): تصدير كامل بأربع أوراق (الشكاوى، الجلسات، سجل الشكاوى،
                سجل الإحالة)، وتصدير الجدول الظاهر، وتصدير التقرير؛ مكتبة SheetJS تُحمَّل عند أول تصدير فقط.
    2026-09-29  نموذج الشكوى: عنوان الاعتراض، رقم الهاتف للاتصال (إلزامي)، رقم واتس/تلغرام (اختياري)،
                حذف 00 من بداية الأرقام، وزر 🎤 لتحويل الكلام إلى نص؛ الحقول الجديدة في الجدول والتقارير والتصدير.
    2026-09-29  ثلاث نتائج (نتيجة الشكوى الداخلية، ما يراه المشتكي، ما يراه المعترض) — الجلسات تُرحِّل إلى
                الداخلية فقط؛ الجلسات تُعدَّل ولا تُحذف؛ فتح شكوى من «المطلوب» يطلب تحديد التنبيه القادم والمطلوب عنده.
=======================================================================
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<!-- عرض مناسب للجوال، مع دعم حواف الشاشات الحديثة -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة شكاوى لجنة الحج</title>
<!-- الخط العربي Tajawal -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  /* متغيرات الألوان والأبعاد الموحدة للمنصة */
  :root {
    --bg: #f4f5f1;
    --card: #ffffff;
    --ink: #1c2a23;
    --muted: #65736b;
    --line: #e2e6e0;
    --brand: #0e6b4f;
    --brand-dark: #0a4f3b;
    --brand-soft: #e6f2ec;
    --gold: #b8913a;
    --danger: #b42318;
    --danger-soft: #fdecea;
    --ok: #067647;
    --ok-soft: #e7f6ee;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(20, 40, 30, .06), 0 4px 16px rgba(20, 40, 30, .05);
  }

  /* إعدادات أساسية: الخط، الخلفية، وتثبيت حجم النص على الجوال عند تدوير الشاشة */
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); overflow-x: hidden;
    font-family: "Tajawal", "Segoe UI", Tahoma, sans-serif; font-size: 15px; line-height: 1.6;
  }
  a { color: var(--brand); }
  button, input, select, textarea { font: inherit; color: inherit; }

  /* الشريط العلوي: الشعار واسم الصفحة وزر الخروج (مع مراعاة حافة الشاشة في الجوال) */
  .topbar { background: var(--brand-dark); color: #fff; padding-top: env(safe-area-inset-top, 0px); }
  .topbar-inner { max-width: 1200px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; color: #fff; min-width: 0; text-decoration: none; }
  .brand small { font-weight: 500; opacity: .75; font-size: 14px; }
  .brand-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--gold); display: grid; place-items: center; font-size: 18px; flex: none; }

  /* الحاوية الرئيسية */
  .container { max-width: 1200px; margin: 0 auto; padding: 24px 16px; padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px)); }
  .narrow { max-width: 480px; margin: 0 auto; }

  /* رأس الصفحة: العنوان والوصف */
  .page-head { margin-bottom: 16px; }
  .page-head h1 { margin: 0; font-size: 22px; font-weight: 800; }
  .page-head p { margin: 4px 0 0; color: var(--muted); }

  /* البطاقات البيضاء */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; }
  .card + .card { margin-top: 14px; }
  .card h2 { margin: 0 0 12px; font-size: 17px; }

  /* حقول النماذج؛ خط 16px يمنع التكبير التلقائي في iPhone */
  .grid { display: grid; gap: 12px 16px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field.full { grid-column: 1 / -1; }
  .field-label { font-weight: 600; font-size: 14px; }
  .req { color: var(--danger); margin-inline-start: 3px; }
  .hint { color: var(--muted); font-size: 12.5px; }
  input, select, textarea {
    width: 100%; padding: 10px 12px; border: 1px solid #cfd6cf; border-radius: 9px; background: #fff;
    outline: none; font-size: 16px; transition: border-color .15s, box-shadow .15s;
  }
  input[type=checkbox] { width: 18px; height: 18px; padding: 0; accent-color: var(--brand); cursor: pointer; }
  input:focus, select:focus, textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(14,107,79,.15); }
  textarea { min-height: 110px; resize: vertical; }
  /* خانة الرمز: كبيرة ومتباعدة في المنتصف */
  input.code-input { text-align: center; font-size: 24px; letter-spacing: 6px; font-weight: 700; direction: ltr; }
  /* خانة كلمة المرور المخفية: في المنتصف مع زر إظهار/إخفاء */
  input.secret-input { text-align: center; font-size: 20px; letter-spacing: 2px; direction: ltr; padding-inline: 48px; }
  .pw-wrap { position: relative; }
  .pw-toggle { position: absolute; top: 50%; transform: translateY(-50%); inset-inline-start: 6px; width: 38px; height: 38px; border: 0; background: transparent; cursor: pointer; font-size: 20px; border-radius: 8px; }
  .pw-toggle:hover { background: #f0f2ef; }

  /* الأزرار */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; border: 1px solid transparent; border-radius: 10px; padding: 9px 16px; font-weight: 700; font-size: 15px; cursor: pointer; background: var(--brand); color: #fff; text-decoration: none; white-space: nowrap; }
  .btn:hover { background: var(--brand-dark); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn.gold { background: var(--gold); }
  .btn.secondary { background: #fff; color: var(--ink); border-color: #cfd6cf; }
  .btn.secondary:hover { background: #f3f5f2; }
  .btn.danger-text { background: none; color: var(--danger); border: 0; min-height: 0; padding: 4px 6px; }
  .btn.sm { min-height: 36px; padding: 6px 12px; font-size: 14px; }
  .btn.ghost { min-height: 34px; padding: 4px 12px; font-size: 14px; background: transparent; border-color: rgba(255,255,255,.3); color: #e3f1ea; }
  .btn.block { width: 100%; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .row > .grow { flex: 1 1 180px; }

  /* رسائل التنبيه */
  .alert { padding: 11px 14px; border-radius: 9px; margin-bottom: 14px; font-weight: 500; }
  .alert.error { background: var(--danger-soft); color: var(--danger); }
  .alert.ok { background: var(--ok-soft); color: var(--ok); }
  .alert.info { background: #eaf2fd; color: #1d5fbf; }

  /* ألوان الحالات: جديد برتقالي، قيد المراجعة أزرق، جاري المتابعة بنفسجي، مغلقة أخضر
     (--st لون الحالة الأساسي، --st-soft خلفيته الفاتحة) */
  .st-new { --st: #c2610c; --st-soft: #fff4e6; }
  .st-review { --st: #1d5fbf; --st-soft: #eaf2fd; }
  .st-follow { --st: #7a3fb8; --st-soft: #f3ecfb; }
  .st-closed { --st: #16803c; --st-soft: #e8f6ed; }

  /* شارة الحالة بلونها */
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap; background: var(--st-soft, #eef0ed); color: var(--st, #46534c); border: 1px solid var(--st, transparent); }

  /* بطاقة الشكوى (في نافذة التفاصيل) بلون حالتها: شريط جانبي وخلفية فاتحة */
  .card.status-card { border-inline-start: 6px solid var(--st); background: linear-gradient(to left, var(--st-soft), #fff 70%); }
  .card.status-card .c-no { color: var(--st); }

  /* صف جدول بلون حالته */
  table tr.status-row td:first-child { border-inline-start: 5px solid var(--st); }
  table tr.status-row { background: var(--st-soft); }

  /* صفحات الدخول: الشعار الكبير والعنوان */
  .hero { text-align: center; margin: 8px 0 18px; }
  .hero .brand-mark { width: 64px; height: 64px; font-size: 34px; border-radius: 16px; margin: 0 auto 10px; }
  .hero h1 { margin: 0; font-size: 22px; font-weight: 800; }
  .hero p { margin: 4px 0 0; color: var(--muted); }
  .below-link { text-align: center; margin-top: 16px; }

  /* رسالة النجاح ورقم الشكوى ورمز المتابعة */
  .done { text-align: center; padding: 30px 20px; }
  .done .icon { font-size: 56px; line-height: 1; }
  .done h2 { margin: 14px 0 6px; font-size: 22px; color: var(--ok); }
  .ticket { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 18px 0 8px; }
  .ticket div { background: #f3f7f4; border: 2px dashed #b9d3c5; border-radius: 12px; padding: 10px 6px; }
  .ticket small { display: block; color: var(--muted); font-weight: 600; }
  .ticket b { display: block; font-size: 22px; letter-spacing: 2px; direction: ltr; color: var(--brand-dark); }

  /* التبويبات وأزرار التصفية (قابلة للتمرير أفقياً على الجوال) */
  .tabs { display: flex; gap: 4px; background: #e9ece7; border-radius: 11px; padding: 4px; margin-bottom: 16px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { flex: 1 0 auto; border: 0; background: transparent; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 700; color: var(--muted); white-space: nowrap; }
  .tabs button.active { background: #fff; color: var(--ink); box-shadow: var(--shadow); }
  .tab-count { display: inline-block; min-width: 22px; padding: 0 6px; margin-inline-start: 6px; border-radius: 999px; background: #c0262d; color: #fff; font-size: 12.5px; line-height: 20px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 12px; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { border: 1px solid var(--line); background: #fff; padding: 5px 12px; border-radius: 999px; cursor: pointer; font-weight: 600; white-space: nowrap; font-size: 14px; }
  .chips button.active { background: var(--brand); border-color: var(--brand); color: #fff; }

  /* جدول الشكاوى (مثل Excel): إطار قابل للتمرير، رأس ثابت، صفوف قابلة للاختيار */
  .table-wrap { overflow: auto; max-height: 72vh; border-radius: var(--radius); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 9px 10px; text-align: start; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 700; font-size: 13px; background: #fafbf9; white-space: nowrap; position: sticky; top: 0; z-index: 1; }
  table.sheet td { white-space: nowrap; }
  table.sheet td.wrap { white-space: normal; min-width: 220px; max-width: 320px; overflow-wrap: anywhere; }
  table.sheet tbody tr { cursor: pointer; }
  table.sheet tbody tr:hover td { filter: brightness(.97); }
  table.sheet tr.selected td { background: #fff3c4 !important; }
  table.sheet td.chk, table.sheet th.chk { width: 36px; text-align: center; }
  .clip { display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  td.subj { max-width: 320px; overflow-wrap: anywhere; }

  /* عناوين قابلة للفرز: السهم ▲ تصاعدي، ▼ تنازلي، ⇅ بلا فرز */
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--ink); background: #f0f3ef; }
  .sort-arrow { font-size: 11px; color: var(--brand); margin-inline-start: 2px; }
  .sort-arrow.off { color: #b7c0b9; }
  table.sheet th { font-size: .9em; }

  /* شريط أدوات الجدول: عدد الأسطر، الأعمدة، حجم الخط، التصدير */
  .table-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
  .table-tools .tool { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--muted); }
  .table-tools select { width: auto; min-height: 36px; padding: 5px 10px; }
  .table-tools .tool-end { margin-inline-start: auto; }
  .font-tools { gap: 4px !important; }
  .font-tools .btn { min-width: 40px; }
  .cols-menu { position: relative; }
  .menu-back { position: fixed; inset: 0; z-index: 20; }
  .menu { position: absolute; top: calc(100% + 6px); inset-inline-start: 0; z-index: 21; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.14); padding: 8px; min-width: 200px; max-height: 60vh; overflow-y: auto; }
  .menu label { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; color: var(--ink); font-weight: 500; }
  .menu label:hover { background: #f3f5f2; }
  .pager { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 10px; font-size: 14px; }

  /* شريط التغيير الجماعي: يظهر عند اختيار صف أو أكثر */
  .bulk-bar { background: var(--brand-dark); color: #fff; border-radius: var(--radius); padding: 12px; margin-bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .bulk-bar b { white-space: nowrap; }
  .bulk-bar select, .bulk-bar input { width: auto; flex: 1 1 150px; min-height: 40px; padding: 7px 10px; color: var(--ink); background: #fff; }
  .bulk-bar .btn.secondary { background: transparent; color: #fff; border-color: rgba(255,255,255,.4); }

  /* أشرطة التنبيهات: عاجل أحمر، متابعة برتقالي، تذكير أزرق، مجدول رمادي */
  .reminder-bar { border-radius: 9px; padding: 7px 12px; margin: 4px 0 10px; font-weight: 700; font-size: 14px; }
  .reminder-bar.danger { background: #c0262d; color: #fff; }
  .reminder-bar.warn { background: #fff4e6; color: #c2610c; border: 1px solid #f3c99a; }
  .reminder-bar.info { background: #eaf2fd; color: #1d5fbf; }
  .reminder-bar.later { background: #f1f2f0; color: #5c6660; font-weight: 500; }
  .alert-tag { display: block; font-size: 12.5px; font-weight: 700; border-radius: 6px; padding: 1px 8px; margin-bottom: 3px; white-space: normal; }
  .alert-tag.danger { background: #c0262d; color: #fff; }
  .alert-tag.warn { background: #ffe6cc; color: #a24f06; }
  .alert-tag.info { background: #d9e8fc; color: #1d5fbf; }
  .alert-tag.later { background: #eceeed; color: #5c6660; }
  .alert-chip { padding: 4px 12px; border-radius: 999px; font-weight: 700; font-size: 14px; }
  .alert-chip.danger { background: #fdecec; color: #c0262d; }
  .alert-chip.warn { background: #fff4e6; color: #c2610c; }
  .alert-chip.info { background: #eaf2fd; color: #1d5fbf; }
  .alert-chip.later { background: #f1f2f0; color: #5c6660; }

  /* نافذة تفاصيل الشكوى (فوق الصفحة) */
  .modal-back { position: fixed; inset: 0; background: rgba(15, 25, 20, .5); z-index: 50; overflow-y: auto; padding: 24px 12px; }
  .modal { max-width: 760px; margin: 0 auto; }
  .modal-close { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  .c-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
  .c-no { font-weight: 800; direction: ltr; }
  .meta { color: var(--muted); font-size: 13.5px; display: flex; gap: 4px 14px; flex-wrap: wrap; }
  .subject { background: #f8f9f7; border-radius: 9px; padding: 10px 12px; margin: 10px 0 14px; white-space: pre-wrap; overflow-wrap: anywhere; }

  /* قسم الجلسات داخل تفاصيل الشكوى: فاصل منقّط، وجدول صغير، ونموذج جلسة جديدة */
  .sessions { margin-top: 20px; padding-top: 16px; border-top: 2px dashed var(--line); }
  .sessions h3 { margin: 0 0 10px; font-size: 16px; }
  .session-form { background: rgba(255,255,255,.7); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }

  /* بطاقة التقارير (للاطلاع فقط): صفوف قابلة للضغط، شارة القراءة، وشبكة البيانات */
  table.stack tr.clickable { cursor: pointer; }
  table.stack tr.clickable:hover td { filter: brightness(.97); }
  .readonly-tag { background: #eef0ed; color: #46534c; border-radius: 999px; padding: 0 8px; font-weight: 700; }
  .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px 18px; margin: 10px 0 14px; }
  .detail-grid dt { color: var(--muted); font-size: 13px; }
  .detail-grid dd { margin: 2px 0 0; font-weight: 700; overflow-wrap: anywhere; }

  /* مربع «حدّد موعد التنبيه القادم» عند فتح الشكوى من «المطلوب» */
  .due-prompt { background: #fff4e6; border: 2px solid #f3c99a; border-radius: 12px; padding: 12px; margin-bottom: 14px; }

  /* عنوان الاعتراض في نافذة الشكوى */
  .c-title { font-weight: 800; font-size: 16px; margin-top: 10px; }

  /* زر التسجيل الصوتي أثناء الاستماع: أحمر نابض */
  .btn.danger-mic { background: var(--danger); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .7; } }

  /* مهلة الاعتراض: أخضر فاتح، وأحمر عند انتهائها */
  .deadline { background: var(--ok-soft); color: var(--ok); border-radius: 9px; padding: 7px 12px; margin-bottom: 10px; font-size: 14px; }
  .deadline.over { background: var(--danger-soft); color: var(--danger); }

  /* سجل الشكوى: خط زمني (الإحالة بلون أزرق، الحالة بلون بنفسجي) */
  .timeline { list-style: none; margin: 0; padding: 0 14px 0 0; border-inline-start: 2px solid var(--line); }
  .timeline li { position: relative; padding: 0 16px 14px 0; }
  .timeline li::before { content: ""; position: absolute; inset-inline-start: -7px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: #b7c0b9; border: 2px solid #fff; }
  .timeline li.ref::before { background: #1d5fbf; }
  .timeline li.st::before { background: #7a3fb8; }
  .timeline .t-head { font-size: 14.5px; }
  .timeline .t-body { font-size: 14px; margin-top: 2px; overflow-wrap: anywhere; }
  .timeline .t-body .old { color: var(--muted); text-decoration: line-through; }
  .timeline .t-note { font-size: 13.5px; background: #f8f9f7; border-radius: 6px; padding: 4px 8px; margin-top: 4px; overflow-wrap: anywhere; }
  .timeline .t-by { font-size: 12.5px; margin-top: 2px; }

  /* وضع دخول المشتكين: بطاقات اختيار */
  .modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  .mode { border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; background: #fff; text-align: start; }
  .mode b { display: block; font-size: 16px; }
  .mode span { color: var(--muted); font-size: 13.5px; }
  .mode.active { border-color: var(--brand); background: var(--brand-soft); }

  /* مفتاح تشغيل/إيقاف (زر التقديم المباشر) */
  .switch-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; cursor: pointer; background: #fff; }
  .switch-row.on { border-color: var(--brand); background: var(--brand-soft); }
  .switch-row input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .switch { flex: none; width: 48px; height: 28px; border-radius: 999px; background: #c9d0ca; position: relative; transition: background .15s; }
  .switch::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: inset-inline-start .15s; }
  .switch-row.on .switch { background: var(--brand); }
  .switch-row.on .switch::after { inset-inline-start: 23px; }
  .switch-row input:focus-visible + .switch { box-shadow: 0 0 0 3px rgba(14,107,79,.3); }

  /* رمز جديد يظهر بخط كبير */
  .big-code { text-align: center; font-size: 34px; font-weight: 800; letter-spacing: 4px; direction: ltr; color: var(--brand-dark); background: #f3f7f4; border: 2px dashed #b9d3c5; border-radius: 12px; padding: 10px; margin: 8px 0 12px; user-select: all; }

  /* القوائم البسيطة (كلمات المرور) */
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .list li:last-child { border-bottom: 0; }
  .mono { direction: ltr; font-weight: 800; letter-spacing: 2px; font-family: ui-monospace, Consolas, monospace; }

  /* التقارير: بطاقات الأعداد والفلتر */
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); border-top: 4px solid var(--brand); text-align: center; }
  .kpi .label { color: var(--muted); font-size: 13.5px; font-weight: 600; }
  .kpi .value { font-size: 32px; font-weight: 800; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .kpi.closed { border-top-color: #16803c; background: #e8f6ed; } .kpi.closed .value { color: #16803c; }
  .kpi.open { border-top-color: #1d5fbf; background: #eaf2fd; } .kpi.open .value { color: #1d5fbf; }
  .filters { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .filters .field { flex: 1 1 140px; }

  /* أدوات عامة */
  .muted { color: var(--muted); }
  .center { text-align: center; }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }
  .spinner { width: 26px; height: 26px; border: 3px solid #d7dfd9; border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; margin: 50px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  code { background: #eef0ed; padding: 1px 6px; border-radius: 5px; direction: ltr; display: inline-block; }

  /* الجوال (أقل من 640px): مسافات أصغر وحقول بعمود واحد؛ جدول التقارير يتحول إلى بطاقات
     (جدول الشكاوى في الأدمن يبقى جدولاً داخل إطار قابل للتمرير مثل Excel) */
  @media (max-width: 640px) {
    .container { padding-top: 16px; }
    .card { padding: 16px; }
    .page-head h1, .hero h1 { font-size: 20px; }
    .grid { grid-template-columns: 1fr; }
    .brand { font-size: 15px; }
    .brand small { display: none; }
    .kpis { gap: 8px; }
    .kpi { padding: 10px 6px; }
    .kpi .value { font-size: 26px; }
    .modal-back { padding: 10px 6px; }
    table.stack thead { display: none; }
    table.stack, table.stack tbody, table.stack tr, table.stack td { display: block; width: 100%; max-width: none; }
    table.stack tr { padding: 12px 14px; border-bottom: 1px solid var(--line); }
    table.stack td { border: 0; padding: 3px 0; }
    table.stack td::before { content: attr(data-label); display: block; color: var(--muted); font-size: 12.5px; font-weight: 600; }
    table.stack tr.status-row { border-inline-start: 5px solid var(--st); }
    table.stack tr.status-row td:first-child { border-inline-start: 0; }
  }
</style>
</head>
<body>
<!-- العنصر الذي يُعرض داخله التطبيق كاملاً -->
<div id="root"></div>

<!-- المكتبات: ملف الإعدادات، React، عميل Supabase، ومحوّل JSX (Babel) -->
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

<!-- كود التطبيق (React/JSX) — يُحوَّل في المتصفح مباشرة -->
<script type="text/babel" data-presets="react">
// استيراد خطافات React المستخدمة في المكونات
const { useState, useEffect, useCallback } = React;

// =====================================================================
// الإعدادات والثوابت
// =====================================================================
// قراءة الإعدادات من config.js والتأكد من أنها ضُبطت
const cfg = window.APP_CONFIG || {};
const isConfigured = !!cfg.SUPABASE_URL && !cfg.SUPABASE_URL.includes("YOUR_") && !!cfg.SUPABASE_ANON_KEY && !cfg.SUPABASE_ANON_KEY.includes("YOUR_");
const CLASSIFICATIONS = cfg.CLASSIFICATIONS || ["أخرى"];

// حالات الشكوى (تطابق القيد في schema.sql) واسم لاتيني لكل حالة لاستخدامه في الألوان
const STATUSES = ["جديد", "قيد المراجعة", "جاري المتابعة", "مغلقة"];
const ST_KEY = { "جديد": "new", "قيد المراجعة": "review", "جاري المتابعة": "follow", "مغلقة": "closed" };
const stClass = s => `st-${ST_KEY[s] || "new"}`;
const CLOSED = "مغلقة";

// اتصال Supabase بالمفتاح العام فقط (لا توجد حسابات مستخدمين)
const sb = isConfigured
  ? window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false } })
  : null;

// =====================================================================
// دوال مساعدة
// =====================================================================
// قراءة وكتابة آمنة في التخزين (قد يكون معطّلاً في التصفح الخاص)
function storeGet(storage, key) { try { return storage.getItem(key); } catch { return null; } }
function storeSet(storage, key, value) { try { value == null ? storage.removeItem(key) : storage.setItem(key, value); } catch { /* غير متاح */ } }

// شكاوى المشتكي المحفوظة على جهازه: [{number, code}]
const MY_KEY = "hajj_my_complaints";
function myComplaints() { try { const l = JSON.parse(storeGet(localStorage, MY_KEY) || "[]"); return Array.isArray(l) ? l : []; } catch { return []; } }
function rememberMine(number, code) { storeSet(localStorage, MY_KEY, JSON.stringify([{ number, code }, ...myComplaints().filter(x => x.number !== number)].slice(0, 20))); }

// تنسيق التواريخ للعرض بالعربية مع أرقام لاتينية، وللحقول بالتوقيت المحلي
const fmtDate = v => v ? new Date(v).toLocaleDateString("ar-u-nu-latn", { dateStyle: "medium" }) : "—";
const fmtDateTime = v => v ? new Date(v).toLocaleString("ar-u-nu-latn", { dateStyle: "medium", timeStyle: "short" }) : "—";
const pad = n => String(n).padStart(2, "0");
const toDateInput = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dateInputToIso = s => s ? new Date(`${s}T12:00:00`).toISOString() : null;   // منتصف النهار حتى لا يتغير اليوم
const toDateTimeInput = v => { if (!v) return ""; const d = new Date(v); return `${toDateInput(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const dateTimeInputToIso = s => s ? new Date(s).toISOString() : null;

// رابط المنصة بدون جزء #
const siteUrl = () => location.href.split("#")[0];

// نسخ نص إلى الحافظة؛ تُرجع true عند النجاح
async function copyText(text) { try { await navigator.clipboard.writeText(text); return true; } catch { return false; } }

// ---------------------------------------------------------------------
// التصدير إلى Excel (‎.xlsx): مكتبة SheetJS تُحمَّل فقط عند أول تصدير (حجمها كبير، فلا تُبطئ الصفحة)
// ---------------------------------------------------------------------
let xlsxPromise = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!xlsxPromise) xlsxPromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = () => resolve(window.XLSX);
    s.onerror = () => { xlsxPromise = null; reject(new Error("تعذّر تحميل أداة Excel")); };
    document.head.appendChild(s);
  });
  return xlsxPromise;
}

// تاريخ ووقت بصيغة قابلة للفرز في Excel: 2026-09-29 14:30
const xlDate = v => { if (!v) return ""; const d = new Date(v); return `${toDateInput(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };

// إنشاء ملف Excel من عدة أوراق [{name, headers, rows}] وتنزيله؛ الأوراق من اليمين إلى اليسار
async function saveWorkbook(sheets, filename) {
  const XLSX = await loadXLSX();
  const wb = XLSX.utils.book_new();
  wb.Workbook = { Views: [{ RTL: true }] };
  sheets.forEach(sh => {
    const ws = XLSX.utils.aoa_to_sheet([sh.headers, ...sh.rows.map(r => r.map(v => v ?? ""))]);
    // عرض كل عمود حسب أطول قيمة فيه (بين 10 و60 حرفاً)
    ws["!cols"] = sh.headers.map((h, i) => ({ wch: Math.min(60, Math.max(10, h.length + 2, ...sh.rows.map(r => String(r[i] ?? "").length + 2))) }));
    XLSX.utils.book_append_sheet(wb, ws, sh.name.slice(0, 31));
  });
  XLSX.writeFile(wb, filename);
}

// تصدير كامل للأدمن: الشكاوى، الجلسات، سجل الشكاوى، وسجل الإحالة — في ملف واحد
async function exportAllToExcel(secret, complaints) {
  const [s, l] = await Promise.all([
    sb.rpc("admin_list_sessions", { p_secret: secret, p_complaint_id: null }),
    sb.rpc("admin_export_log", { p_secret: secret }),
  ]);
  if (s.error || l.error) throw new Error(NET_ERR);
  const log = l.data || [];
  await saveWorkbook([
    { name: "الشكاوى",
      headers: ["رقم الشكوى", "تاريخ الشكوى", "الحالة", "عنوان الاعتراض", "المشتكي", "رقم الهاتف", "واتس / تلغرام", "المشتكى عليه",
                "نص الشكوى", "التصنيف", "مُحالة إلى", "نتيجة الشكوى", "النتيجة للمشتكي", "النتيجة للمعترض", "تاريخ الإغلاق", "رمز المتابعة", "تنبيه المتابعة", "المطلوب عند التنبيه",
                "ملخص للمشتكى عليه", "آخر موعد للاعتراض", "نص الاعتراض", "تاريخ الاعتراض", "آخر تعديل"],
      rows: complaints.map(c => [c.complaint_number, xlDate(c.received_date), c.status, c.title, c.complainant_name, c.phone_number,
                c.contact_number, c.accused_name, c.subject, c.classification, c.referred_to, c.result, c.complainant_result, c.accused_result,
                xlDate(c.closed_date), c.tracking_code,
                xlDate(c.reminder_at), c.reminder_note, c.objection_summary, xlDate(c.objection_deadline), c.objection_text,
                xlDate(c.objection_at), xlDate(c.updated_at)]) },
    { name: "الجلسات",
      headers: ["رقم الشكوى", "المشتكي", "تاريخ ووقت الجلسة", "مُحالة إلى", "نتيجة الجلسة", "حالة الشكوى"],
      rows: (s.data || []).map(x => [x.complaint_number, x.complainant_name, xlDate(x.session_at), x.referred_to, x.result, x.status]) },
    { name: "سجل الشكاوى",
      headers: ["رقم الشكوى", "الوقت", "الحدث", "القيمة السابقة", "القيمة الجديدة", "بواسطة", "المصدر", "ملاحظة"],
      rows: log.map(x => [x.complaint_number, xlDate(x.at), x.event, x.old_value, x.new_value, x.actor, x.source, x.note]) },
    { name: "سجل الإحالة",
      headers: ["رقم الشكوى", "الوقت", "من", "إلى", "بواسطة", "المصدر"],
      rows: log.filter(x => x.field === "referred_to").map(x => [x.complaint_number, xlDate(x.at), x.old_value, x.new_value, x.actor, x.source]) },
  ], `شكاوى-لجنة-الحج-${toDateInput(new Date())}.xlsx`);
}

// متابعة الجزء بعد # في الرابط (لاختيار الصفحة)
function useHash() {
  const [hash, setHash] = useState(location.hash);
  useEffect(() => {
    const onChange = () => { setHash(location.hash); window.scrollTo(0, 0); };
    window.addEventListener("hashchange", onChange);
    return () => window.removeEventListener("hashchange", onChange);
  }, []);
  return hash;
}

// رسائل موحّدة
const NET_ERR = "تعذّر الاتصال، يرجى المحاولة مرة أخرى.";

// =====================================================================
// مكونات عامة
// =====================================================================
// حقل نموذج موحّد: تسمية + علامة الإلزامي + تلميح اختياري
function Field({ label, required, hint, full, children }) {
  return (
    <label className={`field${full ? " full" : ""}`}>
      <span className="field-label">{label}{required && <b className="req">*</b>}</span>
      {children}
      {hint && <small className="hint">{hint}</small>}
    </label>
  );
}

// رسالة تنبيه، مؤشر تحميل، وشارة حالة بلونها
const Alert = ({ type, children }) => <div className={`alert ${type}`}>{children}</div>;
const Loading = () => <div className="spinner" aria-label="جارٍ التحميل" />;
const StatusBadge = ({ value }) => <span className={`badge ${stClass(value)}`}>{value}</span>;

// الشريط العلوي: الشعار، اسم الصفحة، وزر خروج اختياري
function Header({ label, onLogout }) {
  return (
    <header className="topbar">
      <div className="topbar-inner">
        <a className="brand" href="#"><span className="brand-mark">🕋</span>شكاوى لجنة الحج{label && <small>· {label}</small>}</a>
        {onLogout && <button className="btn ghost" onClick={onLogout}>خروج</button>}
      </div>
    </header>
  );
}

// رسالة تظهر عند عدم ضبط بيانات Supabase في config.js
function SetupNotice() {
  return (
    <div className="card">
      <h2>إعداد الاتصال بقاعدة البيانات</h2>
      <p>ضع <code>SUPABASE_URL</code> و<code>SUPABASE_ANON_KEY</code> في الملف <code>config.js</code> ثم أعد تحميل الصفحة.</p>
    </div>
  );
}

// صفحة دخول موحّدة (كلمة مرور المشتكي، الأدمن، الإدارة): verify(value) تُرجع رسالة خطأ أو null
function GatePage({ title, sub, label, placeholder, numeric, maxLength, secret, initialError, verify, onPass, footer }) {
  // المدخل، حالة التحقق، وإظهار كلمة المرور المخفية
  const [value, setValue] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(initialError || "");
  const [show, setShow] = useState(false);

  // تنظيف المدخل: الأرقام فقط (مع تحويل ٠-٩) عند طلب ذلك
  function onChange(e) {
    let v = e.target.value;
    if (numeric) v = v.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\D/g, "");
    setValue(maxLength ? v.slice(0, maxLength) : v);
  }

  // التحقق عبر الدالة الممرَّرة
  async function submit(e) {
    e.preventDefault();
    setError("");
    if (!value.trim()) return setError(`يرجى إدخال ${label}.`);
    setBusy(true);
    const err = await verify(value.trim());
    setBusy(false);
    if (err) setError(err); else onPass(value.trim());
  }

  // العرض: الشعار، العنوان، الخانة (في المنتصف، ومعها زر إظهار للمخفية)، وزر الدخول
  return (
    <div className="narrow">
      <div className="hero">

              <button type="button" className="pw-toggle" onClick={() => setShow(s => !s)}

}

// رابط «معرفة نتيجة شكوى سابقة» أسفل صفحات المشتكي
const ResultLink = () => <div className="below-link"><a href="#/result">🔎 معرفة نتيجة شكوى سابقة</a></div>;

// =====================================================================
// الصفحة 1: المشتكي
// =====================================================================
// الصفحة الأولى دائماً خانة كلمة المرور (عامة أو خاصة حسب الإعداد)، وتحتها زر
// «تقديم شكوى مباشرة» إن فعّله الأدمن؛ ثم النموذج، ثم رسالة النجاح
function ComplainantPage() {
  // الإعدادات (النوع + زر المباشر)، كلمة المرور المقبولة ("" = مباشر)، خطأ للعودة، والنتيجة
  const [config, setConfig] = useState(null);
  const [loadError, setLoadError] = useState("");
  const [code, setCode] = useState(null);
  const [gateError, setGateError] = useState("");
  const [done, setDone] = useState(null);

  // جلب إعدادات صفحة المشتكي من قاعدة البيانات
  useEffect(() => {
    sb.rpc("get_access_config").then(({ data, error }) => {
      if (error || !data || !data.length) setLoadError(NET_ERR); else setConfig(data[0]);
    });
  }, []);

  // التحقق من كلمة المرور (عامة أو خاصة) عبر check_access_code
  const isPrivate = config && config.mode === "private";
  async function verify(value) {
    if (isPrivate && value.length !== 4) return "كلمة المرور مكوّنة من 4 أرقام.";
    const { data, error } = await sb.rpc("check_access_code", { p_code: value });
    if (error) return NET_ERR;
    return data === "ok" ? null : isPrivate ? "كلمة المرور غير صحيحة أو سبق استخدامها." : "كلمة المرور غير صحيحة.";
  }

  // اختيار ما يُعرض
  if (loadError) return <div className="narrow"><Alert type="error">{loadError}</Alert></div>;
  if (!config) return <Loading />;
  if (done) return <SuccessMessage number={done.complaint_number} code={done.tracking_code} />;
  if (code !== null) return (
    <ComplaintForm code={code} onDone={r => { rememberMine(r.complaint_number, r.tracking_code); setDone(r); }}
      onRejected={msg => { setCode(null); setGateError(msg); }} />
  );
  return (
    <GatePage key={gateError} title="منصة شكاوى لجنة الحج" sub="أدخل كلمة المرور التي وصلتك لتقديم شكواك"
      label="كلمة المرور" placeholder={isPrivate ? "••••" : ""} numeric={isPrivate} maxLength={isPrivate ? 4 : 30}
      initialError={gateError} verify={verify} onPass={v => { setGateError(""); setCode(v); }}
      footer={
        <>
          {config.direct && (
            <div className="card center" style={{ marginTop: 14 }}>
              <p className="muted" style={{ margin: "0 0 10px" }}>ليس لديك كلمة مرور؟</p>
              <button className="btn gold block" onClick={() => { setGateError(""); setCode(""); }}>📝 تقديم شكوى مباشرة</button>
            </div>
          )}
          <ResultLink />
        </>
      } />
  );
}

// نموذج الشكوى: الاسم، الهاتف، واتس/تلغرام، المشتكى عليه، عنوان الاعتراض، نص الاعتراض (مع زر التحدث)
// (رقم الشكوى ورمز المتابعة والتاريخ تلقائية)
function ComplaintForm({ code, onDone, onRejected }) {
  // بيانات النموذج وحالة الإرسال
  const [form, setForm] = useState({ name: "", phone: "", contact: "", accused: "", title: "", subject: "" });
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const set = key => e => setForm(f => ({ ...f, [key]: e.target.value }));
  const setPhone = key => e => setForm(f => ({ ...f, [key]: cleanPhone(e.target.value) }));

  // الإرسال عبر submit_complaint؛ تُرجع رقم الشكوى ورمز المتابعة
  async function submit(e) {
    e.preventDefault();
    setError("");
    if (!form.name.trim() || !form.phone || !form.accused.trim() || !form.title.trim() || !form.subject.trim())
      return setError("يرجى تعبئة جميع الحقول المطلوبة.");
    if (!/^\d{7,15}$/.test(form.phone)) return setError("رقم الهاتف غير صالح. اكتب الأرقام فقط مع رمز الدولة.");
    if (form.contact && !/^\d{7,15}$/.test(form.contact)) return setError("رقم واتس / تلغرام غير صالح. اكتب الأرقام فقط مع رمز الدولة.");
    setBusy(true);
    const { data, error: rpcErr } = await sb.rpc("submit_complaint", {
      p_code: code, p_complainant_name: form.name, p_phone_number: form.phone, p_contact_number: form.contact,
      p_accused_name: form.accused, p_title: form.title, p_subject: form.subject,
    });
    setBusy(false);
    if (rpcErr && rpcErr.message.includes("INVALID_CODE"))
      return onRejected(code ? "كلمة المرور لم تعد صالحة. اطلب كلمة مرور جديدة." : "التقديم المباشر غير متاح حالياً. أدخل كلمة المرور.");
    if (rpcErr || !data || !data.length) return setError("تعذّر إرسال الشكوى، يرجى المحاولة مرة أخرى.");
    onDone(data[0]);
  }

  // العرض: الحقول، وزر التحدث بجانب نص الاعتراض، وزر الإرسال، ورابط معرفة النتيجة
  return (
    <div className="narrow">
      <div className="page-head">
        <h1>تقديم شكوى</h1>
        <p>نستقبل شكواكم ونتابعها بكل اهتمام وسرية</p>
      </div>
      <form className="card" onSubmit={submit} noValidate>
        {error && <Alert type="error">{error}</Alert>}
        <div className="grid" style={{ gridTemplateColumns: "1fr" }}>
          <Field label="اسمك" required><input type="text" value={form.name} onChange={set("name")} maxLength={200} autoComplete="name" /></Field>
          <Field label="رقم الهاتف للاتصال" required hint="مع رمز الدولة، مثال: 963912345678 — لا حاجة لكتابة 00 في البداية">
            <input type="tel" inputMode="tel" dir="ltr" value={form.phone} onChange={setPhone("phone")} maxLength={15} autoComplete="tel" />
          </Field>
          <Field label="رقم واتس / تلغرام" hint="اختياري — إن كان مختلفاً عن رقم الهاتف">
            <input type="tel" inputMode="tel" dir="ltr" value={form.contact} onChange={setPhone("contact")} maxLength={15} />
          </Field>
          <Field label="اسم المشتكى عليه" required><input type="text" value={form.accused} onChange={set("accused")} maxLength={200} /></Field>
          <Field label="عنوان الاعتراض" required hint="عنوان قصير، مثال: تأخر الحافلة"><input type="text" value={form.title} onChange={set("title")} maxLength={150} /></Field>
          <div className="field">
            <div className="row" style={{ justifyContent: "space-between" }}>
              <span className="field-label">نص الاعتراض<b className="req">*</b></span>
              <MicButton onText={t => setForm(f => ({ ...f, subject: (f.subject ? f.subject.replace(/\s*$/, " ") : "") + t }))} onError={setError} />
            </div>
            <textarea value={form.subject} onChange={set("subject")} maxLength={5000} placeholder="اشرح تفاصيل الشكوى: ماذا حدث، ومتى، وأين… أو اضغط 🎤 وتحدّث" style={{ minHeight: 150 }} />
          </div>
        </div>
        <button className="btn block" style={{ marginTop: 18 }} disabled={busy}>{busy ? "جارٍ الإرسال…" : "إرسال الشكوى"}</button>
      </form>
      <ResultLink />
    </div>
  );
}

// تنظيف رقم الهاتف أثناء الكتابة: الأرقام العربية ← إنجليزية، أرقام فقط، وحذف 00 من البداية
function cleanPhone(v) {
  return String(v || "").replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\D/g, "").replace(/^00/, "").slice(0, 15);
}

// زر 🎤 تحويل الكلام إلى نص (يظهر فقط في المتصفحات التي تدعمه، مثل Chrome على الجوال والحاسوب)
function MicButton({ onText, onError }) {
  // هل المتصفح يدعم التعرّف على الكلام؟ وهل التسجيل جارٍ؟
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const [listening, setListening] = useState(false);
  const recRef = React.useRef(null);

  // إيقاف التسجيل عند مغادرة الصفحة
  useEffect(() => () => { try { recRef.current && recRef.current.stop(); } catch {} }, []);
  if (!Recognition) return null;

  // بدء التسجيل بالعربية؛ كل جملة مكتملة تُضاف إلى النص
  function start() {
    const rec = new Recognition();
    rec.lang = "ar-SA";
    rec.continuous = true;
    rec.interimResults = false;
    rec.onresult = e => {
      for (let i = e.resultIndex; i < e.results.length; i++)
        if (e.results[i].isFinal) onText(e.results[i][0].transcript.trim());
    };
    rec.onerror = e => {
      setListening(false);
      if (e.error === "not-allowed" || e.error === "service-not-allowed") onError("اسمح للمتصفح باستخدام الميكروفون لتحويل الكلام إلى نص.");
      else if (e.error !== "no-speech" && e.error !== "aborted") onError("تعذّر تحويل الكلام إلى نص، يمكنك الكتابة يدوياً.");
    };
    rec.onend = () => setListening(false);
    recRef.current = rec;
    try { rec.start(); setListening(true); onError(""); } catch { setListening(false); }
  }

  // إيقاف التسجيل
  function stop() { try { recRef.current && recRef.current.stop(); } catch {} setListening(false); }

  // العرض: زر تحدّث / إيقاف
  return (
    <button type="button" className={`btn sm ${listening ? "danger-mic" : "secondary"}`} onClick={listening ? stop : start}>
      {listening ? "⏹ إيقاف التسجيل" : "🎤 تحدّث بدل الكتابة"}
    </button>
  );
}
